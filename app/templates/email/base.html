<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ business_name }}</title>
  <!--[if mso]><style type="text/css">body,table,td{font-family:Arial,Helvetica,sans-serif!important;}</style><![endif]-->
</head>
<body style="margin:0;padding:0;background:{{ secondary }};font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:{{ secondary }};padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 16px 48px rgba(45,42,46,0.10);border:1px solid rgba(0,0,0,0.04);">
        <!-- Header -->
        <tr>
          <td bgcolor="{{ primary }}" style="background:linear-gradient(135deg,{{ primary }} 0%,{{ accent }} 100%);padding:0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:28px 32px 24px;">
                  {% if logo_url %}
                  <img src="{{ logo_url }}" alt="{{ business_name }}" width="120" style="display:block;height:auto;max-height:44px;margin:0 0 12px;border:0;">
                  {% endif %}
                  <p style="margin:0 0 4px;font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;color:#ffffff;line-height:1.2;letter-spacing:0.01em;">{{ business_name }}</p>
                  {% if email_subtitle %}
                  <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:rgba(255,255,255,0.92);letter-spacing:0.04em;text-transform:uppercase;font-weight:600;">{{ email_subtitle }}</p>
                  {% endif %}
                </td>
              </tr>
              <tr><td style="height:4px;background:rgba(255,255,255,0.25);font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:32px 32px 28px;color:{{ text }};font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;">
            {% block email_body %}{% endblock %}
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:20px 32px 24px;background:{{ secondary }};text-align:center;border-top:1px solid rgba(0,0,0,0.05);">
            <p style="margin:0 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:{{ muted }};line-height:1.5;">
              © {{ business_name }}{% if footer_tagline %} · {{ footer_tagline }}{% endif %}
            </p>
            <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:{{ muted }};opacity:0.85;">
              You're receiving this because you have an active session with us.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
