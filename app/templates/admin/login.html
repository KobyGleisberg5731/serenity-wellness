<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p>Sign in to manage your wellness business</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
      {% endwith %}
      <form method="POST">
        <div class="form-group"><label>Email</label><input name="email" type="email" value="admin@serenity.local" required></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" required></div>
        <button type="submit" class="btn" style="width:100%;margin-top:0.5rem">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
